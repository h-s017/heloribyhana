es, soft light, and decorative lines',['B']],['木頭、石材、大地色與厚實肌理','Wood, stone, earth tones, and substantial texture',['C']],['暗色背景、古典肖像、舊紙張與時間感','Dark backgrounds, classical portraits, old paper, and a sense of time',['D','E','G']]]}];
