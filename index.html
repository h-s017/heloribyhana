<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find Your Helori｜找到專屬你的 Helori</title>
<meta name="description" content="Find Your Helori｜找到專屬你的 Helori。Hana's Scent Artist 的 Helori 氣味角色測驗。" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/helori-theme.css?v=20260612-2" />
<link rel="stylesheet" href="assets/css/helori-override.css?v=20260612-bg" />
<style>
.brand strong{display:flex;align-items:center;gap:.9em;flex-wrap:wrap}
.brand-en{font-family:"Cormorant Garamond",serif;font-weight:500;letter-spacing:.24em;white-space:nowrap;text-transform:uppercase}
.brand-zh{font-family:"Noto Serif TC","PingFang TC",serif;font-weight:400;letter-spacing:.18em;font-size:12px;white-space:nowrap}
#landing h1{font-family:"Cormorant Garamond",serif;font-weight:500;letter-spacing:.045em;color:#1b1915;text-shadow:0 1px 0 rgba(255,255,255,.18)}
#landing h1 em{font-weight:500}
@media(max-width:760px){.brand strong{gap:.45em}.brand-zh{font-size:10px;letter-spacing:.12em}#landing h1{font-weight:500}}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="shell">
  <div class="brand"><strong><span class="brand-en">HANA SCENT ARTIST</span><span class="brand-zh">香徑嗅覺藝術</span></strong><span>H.FUGUE ATELIER</span></div>

  <section id="landing" class="screen active">
    <h1>Find Your<br><em>Helori</em></h1>
    <div class="subtitle">找到專屬你的 Helori</div>
    <p class="lead">遠古時代就存在的神祕生物，這個世界氣味的源頭，Helori，正在等待尋找他的人。</p>
    <div class="constellation" id="constellation"></div>
    <div class="pills">
      <button class="btn" id="shareLandingBtn" type="button">分享給朋友</button>
      <a class="btn" href="https://www.instagram.com/hanas.scent/" target="_blank" rel="noopener">FOLLOW INSTAGRAM</a>
      <a class="btn" href="https://helori.hanascent.com/" target="_blank" rel="noopener">了解課程</a>
    </div>
    <button class="btn primary big" id="startBtn" type="button">Find Your Helori</button>
  </section>

  <section id="quiz" class="screen">
    <div class="progress"><div class="bar"><span id="barFill"></span></div><div class="counter" id="counter">01 / 10</div></div>
    <div class="card" id="questionCard"></div>
  </section>

  <section id="result" class="screen">
    <div class="eyebrow">Your Helori Is …</div>
    <div class="result-card">
      <div class="portrait"><img id="resImg" alt="Helori result"></div>
      <span class="badge" id="atlasNo"></span>
      <div class="res-name" id="resName"></div>
      <div class="res-en" id="resEn"></div>
      <p class="scent-line" id="scentLine"></p>
      <p class="desc" id="resDesc"></p>
      <div class="actions">
        <button class="btn primary" id="sendResultBtn" type="button">到官方 LINE 看完整介紹</button>
        <button class="btn" id="discountBtn" type="button">領取優惠</button>
        <button class="btn" id="shareBtn" type="button">分享給朋友測測看</button>
        <a class="btn" href="https://helori.hanascent.com/" target="_blank" rel="noopener">我想了解 Helori 課程</a>
        <a class="btn ghost" href="https://www.hanascent.com/" target="_blank" rel="noopener">前往官網</a>
        <button class="btn ghost" id="resetBtn" type="button">重新測驗</button>
      </div>
    </div>
    <div class="footer-brand">H.FUGUE ATELIER｜A scent atelier by Hana</div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="assets/js/helori-quiz.js?v=20260612"></script>
</body>
</html>
